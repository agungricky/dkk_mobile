
name: DahaDigitalKreasi Android Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      # AMBIL SOURCE CODE
      - name: Checkout Repository
        uses: actions/checkout@v4

      # JAVA UNTUK BUILD ANDROID
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # INSTALL FLUTTER
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      # DEPENDENCY
      - name: Install Dependencies
        run: flutter pub get

      # CEK VERSI TAG DAN PUBSPEC
      - name: Verify Release Version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml \
            | awk '{print $2}' \
            | cut -d'+' -f1)

          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Versi pubspec.yaml tidak sesuai tag."
            echo "Pubspec: $VERSION"
            echo "Tag: $GITHUB_REF_NAME"
            exit 1
          fi

      # PULIHKAN KEYSTORE DARI GITHUB SECRETS
      - name: Restore Android Signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      # PERIKSA KODE
      - name: Flutter Analyze
        run: flutter analyze

      # BUILD APK RELEASE
      - name: Build Android APK
        run: flutter build apk --release

      # SIMPAN ARTIFACT BUILD
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DahaDigitalKreasi-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      # PUBLIKASIKAN KE GITHUB RELEASES
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "DahaDigitalKreasi $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
